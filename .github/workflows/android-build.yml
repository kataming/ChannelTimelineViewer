name: Android Build

# Android 版（android/）のビルドとユニットテスト。
# iOS と違って macOS ランナーが要らないので、Linux で速く回せる。

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'Localization/strings.json'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 を用意
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle を用意（キャッシュあり）
        uses: gradle/actions/setup-gradle@v4

      - name: 翻訳が最新か確認（strings.json から生成したものと一致するか）
        working-directory: .
        run: |
          set -euo pipefail
          python3 scripts/build_android_strings.py > /dev/null
          if ! git diff --quiet -- android/app/src/main/res; then
            echo "::error::strings.xml が strings.json と食い違っています。"
            echo "python scripts/build_android_strings.py を実行してコミットしてください。"
            git diff --stat -- android/app/src/main/res
            exit 1
          fi

      - name: ユニットテスト
        run: ./gradlew --no-daemon testDebugUnitTest

      # ⚠️ このリポジトリは Public で、artifact は誰でもダウンロードできる。
      # そのため APK に入れるキーは **Android 専用に制限したキー**だけにする
      # （iOS 用のキーを入れると、公開の APK から取り出されてしまう）。
      # YOUTUBE_API_KEY_ANDROID が未設定なら、キー無しの APK を作る（起動と画面確認はできる）。
      - name: デバッグ APK をビルド
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY_ANDROID }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint（エラーがあれば失敗）
        run: ./gradlew --no-daemon lintDebug

      - name: テスト結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/
          retention-days: 7

      - name: APK を保存
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
