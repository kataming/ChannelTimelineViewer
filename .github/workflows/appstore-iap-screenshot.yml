name: App Store IAP Screenshot

# App 内課金（pro_unlock）の審査用スクリーンショットを撮って、そのまま添付する。
#
# 1. シミュレーターで購入画面を開いて撮影（UITests/ProScreenshotUITests.swift）
# 2. Apple が受け付けるサイズ（1242x2688）に合わせる
# 3. App Store Connect API で課金アイテムに添付する
#
# 必要な Secret: ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY / YOUTUBE_API_KEY

on:
  workflow_dispatch:
    inputs:
      upload:
        description: '撮影後に App Store Connect へ添付する'
        type: boolean
        default: true

jobs:
  capture:
    runs-on: macos-26
    env:
      PROJECT: ChannelTimelineViewer.xcodeproj
      SCHEME: ProScreenshot
      RESULT_PATH: build/ProScreenshot.xcresult

    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      # 購入画面までしか行かないので API キーは使わないが、
      # 未設定だと起動直後に警告カードが出るので同じ手順で用意する。
      - name: Prepare Config.plist
        env:
          YT_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          cp Resources/Config.example.plist Resources/Config.plist
          if [ -n "$YT_KEY" ]; then
            /usr/libexec/PlistBuddy -c "Set :YOUTUBE_API_KEY $YT_KEY" Resources/Config.plist
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | test("^iPhone .*Pro Max$")) | .name] | unique | last')
          echo "SIM_NAME=$NAME" >> "$GITHUB_ENV"
          echo "使用するシミュレーター: $NAME"

      - name: Capture the purchase screen
        run: |
          set -o pipefail
          rm -rf "$RESULT_PATH"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -resultBundlePath "$RESULT_PATH" \
            -only-testing:ChannelTimelineViewerUITests/ProScreenshotUITests \
            CODE_SIGNING_ALLOWED=NO \
            test | xcpretty || true

      - name: Export and resize
        run: |
          set -euo pipefail
          mkdir -p build/iap
          xcrun xcresulttool export attachments \
            --path "$RESULT_PATH" --output-path build/attachments
          SRC=$(find build/attachments -name '*iap-review-pro*' -o -name '*.png' | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::スクリーンショットが見つかりませんでした"
            find build/attachments -type f | head -20
            exit 1
          fi
          echo "元画像: $SRC"
          sips -s format png "$SRC" --out build/iap/original.png >/dev/null
          # Apple が受け付ける寸法に合わせる（1242x2688）。
          sips -z 2688 1242 build/iap/original.png --out build/iap/iap-review-pro.png >/dev/null
          sips -g pixelWidth -g pixelHeight build/iap/iap-review-pro.png

      - uses: actions/upload-artifact@v4
        with:
          name: iap-review-screenshot
          path: build/iap/iap-review-pro.png

      - name: Attach to the in-app purchase
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests pyjwt cryptography
          python3 scripts/asc_iap.py --mode screenshot --image build/iap/iap-review-pro.png
