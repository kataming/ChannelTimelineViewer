name: iOS Build

# 目的: まず xcodebuild の Debug ビルドが macOS ランナー上で通ることを確認する。
# App Store / 実機配布・署名は不要。シミュレーター向けのコンパイル確認とテストのみ。

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # GitHub の Actions タブから手動実行も可能

jobs:
  build:
    name: Build & Test (iOS Simulator, Debug)
    runs-on: macos-14   # Xcode 15.x / iOS 17 SDK を含む macOS ランナー

    env:
      PROJECT: ChannelTimelineViewer.xcodeproj
      SCHEME: ChannelTimelineViewer

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # ⚠️ 順序に注意: Config.plist は xcodegen generate より前に作る。
      # XcodeGen は生成時点で存在するファイルだけをリソースに登録するため、
      # 後から作るとアプリバンドルに含まれず、実行時にAPIキーを読めない。
      - name: Prepare Config.plist
        env:
          YT_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          cp Resources/Config.example.plist Resources/Config.plist
          if [ -n "$YT_KEY" ]; then
            echo "実APIキー(Secret)を使用 -> 統合テストが実行されます"
            /usr/libexec/PlistBuddy -c "Set :YOUTUBE_API_KEY $YT_KEY" Resources/Config.plist
          else
            echo "Secret未設定 -> ダミーキー使用(統合テストはスキップ)"
            /usr/libexec/PlistBuddy -c "Set :YOUTUBE_API_KEY CI_DUMMY_KEY_FOR_BUILD" Resources/Config.plist
          fi
          # ※ キー値はログに出さない(Print しない)

      - name: Generate Xcode project
        run: xcodegen generate

      # 共有シート(Share Extension)がターゲットとして生成されているかを確認する。
      # ここが欠けると「共有シートにアプリが出ない」ビルドが黙って出来上がる。
      - name: Verify Share Extension target exists
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -list
          for TARGET in ChannelTimelineViewerShareExtension ChannelTimelineViewerOpenExtension; do
            if ! xcodebuild -project "$PROJECT" -list | grep -q "$TARGET"; then
              echo "::error::$TARGET がプロジェクトに含まれていません(project.yml を確認)"
              exit 1
            fi
          done

      - name: Show available simulators (デバッグ用)
        run: xcrun simctl list devices available | sed -n '1,60p'

      # 最優先: Debug ビルドが通るか（コンパイル確認）。署名なし・シミュレーター向け。
      - name: Build (Debug, simulator, no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      # 共有シート拡張がアプリバンドルに埋め込まれているか（PlugIns/*.appex）を確認する。
      - name: Verify Share Extension is embedded in the app bundle
        run: |
          set -o pipefail
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "ChannelTimelineViewer.app" \
            -path "*Debug-iphonesimulator*" | head -n 1)
          if [ -z "$APP" ]; then
            echo "::warning::ビルド成果物(.app)が見つかりませんでした。埋め込み確認をスキップします。"
            exit 0
          fi
          echo "アプリバンドル: $APP"
          ls "$APP/PlugIns" || true
          COUNT=$(ls -d "$APP"/PlugIns/*.appex 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::拡張が $COUNT 個です（共有シート用とアクション用の2つが埋め込まれるはず）"
            exit 1
          fi
          POINTS=""
          for APPEX in "$APP"/PlugIns/*.appex; do
            POINT=$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$APPEX/Info.plist")
            echo "$(basename "$APPEX"): $POINT"
            /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionAttributes:NSExtensionActivationRule" "$APPEX/Info.plist"
            POINTS="$POINTS $POINT"
          done
          for EXPECTED in com.apple.share-services com.apple.ui-services; do
            case "$POINTS" in
              *"$EXPECTED"*) ;;
              *) echo "::error::拡張ポイント $EXPECTED が見つかりません"; exit 1 ;;
            esac
          done

          # メインアプリ側: カスタムURLスキーム（拡張からアプリを開くのに必須）と
          # 生成された Info.plist の値（表示名）が両方入っていること = マージが効いていること
          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$APP/Info.plist" \
               | grep -q "channeltimelineviewer"; then
            echo "::error::カスタムURLスキーム channeltimelineviewer がアプリの Info.plist にありません"
            echo "（App/Info.plist と GENERATE_INFOPLIST_FILE のマージを確認してください）"
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist" >/dev/null 2>&1; then
            echo "::error::CFBundleDisplayName が失われています（INFOPLIST_KEY_* のマージを確認）"
            exit 1
          fi
          echo "✓ 共有シート拡張とカスタムURLスキームを確認しました"

      # 可能ならユニットテストも実行。シミュレーター名はランナー/Xcodeで変わるため、
      # 実在する iPhone シミュレーターの UDID を動的に選んで使う（堅牢化）。
      - name: Test (unit tests on simulator)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | test("^iPhone"))] | .[0].udid')
          echo "Selected simulator UDID: $UDID"
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "利用可能な iPhone シミュレーターが見つかりません"; exit 1
          fi
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=$UDID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test
