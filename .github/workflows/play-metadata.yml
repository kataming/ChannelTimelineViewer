name: Play Metadata

# Google Play のストア掲載情報（7言語のテキスト＋画像）を API で反映する。
# 画面で7言語ぶんを手入力する代わりに、docs/PlayStore/ の原本から流し込む。
#
# 必要な Secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
#   （Play Console の「ユーザーと権限」で、このアプリの「ストアでの表示の管理」権限が要る）
#
# データセーフティ・コンテンツのレーティング・広告の申告・価格は API では設定できないため、
# 引き続き Play Console の画面で行う（docs/android-play-release-guide.md 参照）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '動作（status=確認のみ / listing=掲載情報と画像を反映 / promote=既存ビルドを別トラックへ下書きで載せる / purchase-check=Pro 購入の確認（acknowledge）状態を読むだけ / order-revoke=テスト購入を払い戻して取り消す / offer-show=割引オファーを読む / offer-raw=商品とオファーの中身をそのまま読む / offer-create=割引オファーを下書きで作る / offer-activate=有効化 / offer-deactivate=停止）'
        type: choice
        options: [status, listing, promote, purchase-check, order-revoke, offer-show, offer-raw, offer-create, offer-activate, offer-deactivate]
        default: status
      dry_run:
        description: '送信せず、何をするかだけ表示する'
        type: boolean
        default: true
      track:
        description: 'promote の送り先トラック'
        type: choice
        options: [production, beta, alpha, internal]
        default: production
      version_code:
        description: 'promote するビルド番号（空なら最新）'
        required: false
        default: ''
      release_name:
        description: 'promote するリリースの表示名（例 1.6）'
        required: false
        default: ''

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存関係
        run: pip install --quiet google-api-python-client google-auth

      - name: 原本の検証（文字数）
        run: python scripts/build_play_metadata.py --check

      - name: Play へ問い合わせ / 反映
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ inputs.mode }}
          # 注文IDは Secret から渡す（このリポジトリは Public でログが公開されるため）。
          PLAY_ORDER_ID: ${{ secrets.CTV_TEST_ORDER_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          TRACK: ${{ inputs.track }}
          VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          case "$MODE" in
            offer-*)
              OFFER_MODE="${MODE#offer-}"
              OFFER_ARGS="--mode $OFFER_MODE"
              if [ "$OFFER_MODE" = "create" ] && [ "$DRY_RUN" = "true" ]; then
                OFFER_ARGS="$OFFER_ARGS --dry-run"
              fi
              python scripts/play_offer.py $OFFER_ARGS
              exit 0
              ;;
          esac
          if [ "$MODE" = "order-revoke" ]; then
            # テスト購入の払い戻し＋取り消し。注文IDはログに出さない。
            python scripts/play_order_revoke.py
            exit 0
          fi
          if [ "$MODE" = "purchase-check" ]; then
            # 読み取り専用。購入トークン・注文IDはログに出さない（scripts/play_purchase_check.py）。
            python scripts/play_purchase_check.py
            exit 0
          fi
          ARGS="--mode $MODE"
          if [ "$MODE" != "status" ] && [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "$MODE" = "promote" ]; then
            ARGS="$ARGS --track ${TRACK:-production}"
            [ -n "${VERSION_CODE:-}" ] && ARGS="$ARGS --version-code $VERSION_CODE"
            [ -n "${RELEASE_NAME:-}" ] && ARGS="$ARGS --release-name $RELEASE_NAME"
          fi
          python scripts/play_publish.py $ARGS
