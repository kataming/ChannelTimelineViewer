name: UI Preview

# 目的: 実機や TestFlight に入れる前に、アプリのパーツの見た目を PNG で確認する。
# Windows 環境では Xcode のプレビューが使えないため、macOS ランナーで
# 実アプリのソースをそのままコンパイルして描き出し、成果物として持ち帰る。

on:
  workflow_dispatch:

jobs:
  render:
    name: Render UI parts to PNG
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 実アプリのソース（RepeatModeBadge / RepeatMode）をそのまま使って描き出す。
      # 見た目の確認なので、アプリ全体のビルドは不要。
      - name: Render
        run: |
          set -euo pipefail
          mkdir -p build/ui-preview
          swiftc -O \
            -target arm64-apple-macos13.0 \
            -o build/render-ui-preview \
            tools/UIPreview/main.swift \
            Views/RepeatModeBadge.swift \
            Services/PlaybackSettingsStore.swift
          ./build/render-ui-preview build/ui-preview
          ls -lh build/ui-preview

      - name: Upload preview images
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: build/ui-preview/*.png
          if-no-files-found: error
          retention-days: 7
