# 依存のバージョンはここだけで管理する（build.gradle.kts に直書きしない）
[versions]
agp = "8.10.1"
kotlin = "2.0.21"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigation = "2.8.5"
# Play Billing が 2019 年の fragment 1.1.0 を連れてくるので、版だけ引き上げる
# （このアプリは Fragment を使っていない）。Play Console の「古い SDK バージョン」対策。
fragment = "1.8.9"
coil = "2.7.0"
okhttp = "4.12.0"
serialization = "1.7.3"
# Play Billing: 2026-08-31 以降の新規アプリ・更新は 8 以降が必須。9.x は compileSdk 35 が要る（本アプリは 35）。
billing = "9.1.0"
# Firebase（Android 版のみ）。BOM で個々のライブラリの版を揃える。
# ⚠️ 33.7.0 で止めているのは Kotlin の版に縛られているため。
#    33.8.0 以降は play-services-measurement 22.2.0+ を連れてきて、その中身が
#    Kotlin 2.1 のメタデータで作られており、本プロジェクトの Kotlin 2.0.21 では
#    「Module was compiled with an incompatible version of Kotlin」で**コンパイルできない**。
#    上げたいときは先に kotlin を 2.1 以上（最新の BOM なら 2.2 以上）にすること。
firebaseBom = "33.7.0"
googleServices = "4.5.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
androidxTestCore = "1.6.1"
espresso = "3.6.1"
robolectric = "4.16.1"
coroutinesTest = "1.9.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
billing = { group = "com.android.billingclient", name = "billing", version.ref = "billing" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
# 版は BOM が決めるので version は書かない。
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# google-services.json がある時だけ app 側で適用する（無い環境でもビルドを通すため）。
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
