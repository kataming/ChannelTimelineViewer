<!DOCTYPE html>
<!--
  YouTube 公式埋め込みプレイヤーを表示するための中継ページ。

  【なぜ必要か】
  YouTube は 2025 年後半以降、埋め込みプレイヤーのホストを HTTP Referer で厳格に検証する
  ようになった。iOS の WKWebView は自前の HTML を loadHTMLString で読み込んだ場合も、
  埋め込みURLを直接開いた場合も、YouTube が求める形の Referer を送らないため、
      「この動画は再生できません（エラーコード 152-4）」
      「Error 153 - Video player configuration error」
  となって再生できない（動画側は embeddable=true で制限なしであることを確認済み）。
  Capacitor / React Native / Flutter など他の WebView でも同じ事象が報告されている。

  そこで、実在する HTTPS オリジン（GitHub Pages）に置いたこのページを WKWebView で開き、
  ここから公式プレイヤーを埋め込む。Referer が https://kataming.github.io/... になるため
  YouTube の検証を通る。

  【やっていないこと】
  動画のダウンロード・独自プレイヤーでの再生・広告回避・再生の改変は一切していない。
  表示しているのは YouTube 公式の IFrame Player そのもの。

  【使い方】
    player.html?v=<videoId>&autoplay=1&start=<秒>
  再生状態は window.webkit.messageHandlers.ytHandler 経由でネイティブ側へ通知する
  （アプリ内で開かれた場合のみ。ブラウザで開いた場合は何もしない）。

  start は「続きから再生」用の開始位置（秒）。公式プレイヤーの startSeconds に渡すだけで、
  再生位置の保存はアプリ側（端末内）で行う。再生位置は
      { event: 'time', v: <videoId>, t: <現在位置秒>, d: <長さ秒> }
  として通知する（どの動画の位置かを取り違えないよう videoId を必ず添える）。

  ※ このページは公開済みアプリからも読み込まれるため、変更は**後方互換**にすること。
     （古いアプリは start を送らず、time イベントを無視するだけで従来どおり動く）
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- ここが肝。Referer を送らない/絞りすぎる設定だと YouTube が 153 を返す -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Player</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { background: #000; height: 100%; overflow: hidden; }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; }
  #msg {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; text-align: center;
    color: #ddd; font: 14px/1.6 -apple-system, system-ui, sans-serif; padding: 16px;
  }
</style>
</head>
<body>
<div id="player"></div>
<div id="msg"></div>
<script>
  var params = new URLSearchParams(location.search);
  var videoId = (params.get('v') || '').replace(/[^A-Za-z0-9_-]/g, '');
  var autoplay = params.get('autoplay') === '1' ? 1 : 0;
  // 続きから再生の開始位置（秒）。数値以外・負値は 0 に丸める。
  var startAt = Math.max(0, parseInt(params.get('start') || '0', 10) || 0);
  // 現在プレイヤーに載っている動画ID（再生位置の通知に添える）。
  var currentId = videoId;

  function post(msg) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ytHandler) {
      window.webkit.messageHandlers.ytHandler.postMessage(msg);
    }
  }

  function showMessage(text) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.style.display = 'flex';
  }

  if (!videoId) {
    showMessage('動画が指定されていません。');
  } else {
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = function () {
      post({ event: 'error', code: -3 });
      showMessage('プレイヤーを読み込めませんでした。通信環境を確認してください。');
    };
    document.head.appendChild(tag);
  }

  var player;
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      width: '100%', height: '100%',
      videoId: videoId,
      playerVars: {
        playsinline: 1,
        rel: 0,
        autoplay: autoplay,
        start: startAt,
        // 字幕は既定でオフにする（端末/アカウント側の設定で自動的に出ることがあるため）。
        // プレイヤーの字幕ボタンはそのまま残るので、見たいときはユーザーが出せる。
        cc_load_policy: 0,
        // このページのオリジン。Referer と併せて YouTube 側の検証に使われる。
        origin: location.origin
      },
      events: {
        onReady: function () {
          post({ event: 'ready' });
          disableCaptionsByDefault();
          postOptions();
        },
        onPlaybackRateChange: function () { postOptions(); },
        onStateChange: function (e) {
          post({ event: 'state', state: e.data });
          // 字幕モジュールは再生開始後に読み込まれるので、ここでもう一度オフにする。
          if (e.data === 1) {
            disableCaptionsByDefault();
            postOptions();
            // 字幕トラック一覧は少し遅れて用意されるので、もう一度だけ取り直す。
            setTimeout(postOptions, 1500);
          }
          // 一時停止・終了のタイミングでも位置を通知する（取りこぼし防止）。
          if (e.data === 2 || e.data === 0) { postTime(); }
        },
        onError: function (e) {
          post({ event: 'error', code: e.data });
          showMessage('この動画は再生できませんでした（コード ' + e.data + '）。' +
                      '「YouTubeで開く」からご覧ください。');
        }
      }
    });
  }

  // iframe に referrerpolicy を付ける（IFrame API が生成した後に設定する）。
  var applyReferrerPolicy = setInterval(function () {
    var f = document.querySelector('#player iframe, iframe');
    if (f) {
      f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
      clearInterval(applyReferrerPolicy);
    }
  }, 200);

  // 字幕を既定でオフにする。
  //
  // 端末の「字幕とキャプション」設定や YouTube アカウント側の設定によっては、
  // 何もしなくても字幕が出た状態で始まる。ここでは公式プレイヤーの API で
  // 「選択中の字幕トラックを無し」にするだけで、**字幕ボタン自体は残す**
  // （モジュールを unload すると字幕を出せなくなるので、そこまではしない）。
  // 動画を切り替えるたびに既定オフへ戻す。
  var captionsHandled = false;
  function disableCaptionsByDefault() {
    if (!player || captionsHandled || !player.setOption) { return; }
    try {
      player.setOption('captions', 'track', {});   // HTML5 プレイヤー
      player.setOption('cc', 'track', {});         // 旧モジュール名
      captionsHandled = true;
    } catch (e) {
      // 失敗しても再生には影響しないので握りつぶす
    }
  }

  // 公式プレイヤーの設定メニューは iframe の中に描画されるため、小さな枠に埋め込むと
  // 下が切れて操作できない。そこでアプリ側の画面から操作できるよう、
  // 「選べる再生速度・現在の速度・字幕トラック一覧」を通知し、変更用の関数を公開する。
  // 使うのは公式 IFrame Player API のみで、プレイヤーの見た目は変更しない。
  function postOptions() {
    if (!player) { return; }
    var rates = [];
    var rate = 1;
    var tracks = [];
    var active = null;
    try { rates = player.getAvailablePlaybackRates() || []; } catch (e) {}
    try { rate = player.getPlaybackRate() || 1; } catch (e) {}
    try {
      var list = player.getOption('captions', 'tracklist') || [];
      for (var i = 0; i < list.length; i++) {
        var t = list[i] || {};
        tracks.push({
          code: t.languageCode || '',
          name: t.displayName || t.languageName || t.languageCode || ''
        });
      }
      var current = player.getOption('captions', 'track');
      if (current && current.languageCode) { active = current.languageCode; }
    } catch (e) {}
    post({ event: 'options', rates: rates, rate: rate, captions: tracks, activeCaption: active });
  }

  // 再生速度を変える（アプリの設定画面から呼ぶ）。
  function setRate(r) {
    if (player && player.setPlaybackRate) {
      player.setPlaybackRate(Number(r) || 1);
      postOptions();
    }
  }

  // 字幕トラックを選ぶ。code が空なら字幕オフ。
  function setCaptionTrack(code) {
    if (!player || !player.setOption) { return; }
    try {
      if (code) {
        if (player.loadModule) { player.loadModule('captions'); }
        player.setOption('captions', 'track', { languageCode: code });
      } else {
        player.setOption('captions', 'track', {});
      }
      // ユーザーが自分で選んだので、既定オフの処理で上書きしない。
      captionsHandled = true;
    } catch (e) {}
    postOptions();
  }

  // 現在の再生位置をアプリへ通知する（「続きから再生」用。保存はアプリ側の端末内のみ）。
  function postTime() {
    if (!player || !player.getCurrentTime) { return; }
    var t = player.getCurrentTime() || 0;
    var d = (player.getDuration && player.getDuration()) || 0;
    if (t > 0) { post({ event: 'time', v: currentId, t: t, d: d }); }
  }

  // 再生中は定期的に通知（5秒ごと）。停止中は何もしない。
  setInterval(function () {
    if (player && player.getPlayerState && player.getPlayerState() === 1) { postTime(); }
  }, 5000);

  // 画面を離れるときにも最後の位置を残す。
  window.addEventListener('pagehide', postTime);

  // 外部から動画を差し替えるためのAPI（アプリ側が evaluateJavaScript で呼ぶ）
  // 第2引数 start は「続きから再生」の開始位置（秒）。省略時は 0（＝最初から）。
  function loadVideo(id, start) {
    if (!player || !player.loadVideoById) { return; }
    postTime();                       // 切り替え前に「今の動画」の位置を残す
    currentId = id;
    captionsHandled = false;          // 次の動画でも字幕は既定オフから
    player.loadVideoById({ videoId: id, startSeconds: Math.max(0, start || 0) });
  }
  function cueVideo(id, start) {
    if (!player || !player.cueVideoById) { return; }
    postTime();
    currentId = id;
    captionsHandled = false;
    player.cueVideoById({ videoId: id, startSeconds: Math.max(0, start || 0) });
  }
  // 「最初から再生」などで位置を移動する。
  function seekTo(seconds) {
    if (player && player.seekTo) { player.seekTo(Math.max(0, seconds || 0), true); }
  }
</script>
</body>
</html>
