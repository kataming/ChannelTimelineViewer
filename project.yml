name: ChannelTimelineViewer

options:
  bundleIdPrefix: com.deskflowlabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # === 提出準備中 ===
    # Bundle ID は App Store Connect 登録済みの値に設定済み(下のターゲット設定)。
    # DEVELOPMENT_TEAM は Team ID(10桁) を入れると署名が有効になる。空のままなら従来どおり
    # 署名なし(CI は CODE_SIGNING_ALLOWED=NO / ローカルはシミュレーター実行)で動く。
    # Team ID の確認: https://developer.apple.com/account → Membership details
    DEVELOPMENT_TEAM: "893UUWYHB8"

targets:
  ChannelTimelineViewer:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Services
      - ViewModels
      - Views
      - path: Resources
        # Config.plist / Config.example.plist などをバンドルリソースとして含める
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # App Store Connect に登録済みの Bundle ID と一致させること
        PRODUCT_BUNDLE_IDENTIFIER: com.deskflowlabs.channeltimelineviewer
        TARGETED_DEVICE_FAMILY: "1"          # iPhone のみ
        # アセットカタログ(Resources/Assets.xcassets)のアイコン/アクセントカラーを使用
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "Channel Timeline Viewer"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  ChannelTimelineViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: ChannelTimelineViewer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.deskflowlabs.channeltimelineviewer.tests

  # App Store 用スクリーンショットを撮るためだけの UI テスト。
  # 実 API とネットワークを使うので、通常の CI(ChannelTimelineViewer スキーム)では実行しない。
  ChannelTimelineViewerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: ChannelTimelineViewer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.deskflowlabs.channeltimelineviewer.uitests
        TEST_TARGET_NAME: ChannelTimelineViewer

schemes:
  ChannelTimelineViewer:
    build:
      targets:
        ChannelTimelineViewer: all
        ChannelTimelineViewerTests: [test]
    test:
      targets:
        - ChannelTimelineViewerTests

  # スクリーンショット撮影専用スキーム（通常 CI とは分離）
  Screenshots:
    build:
      targets:
        ChannelTimelineViewer: all
        ChannelTimelineViewerUITests: [test]
    test:
      targets:
        - ChannelTimelineViewerUITests
