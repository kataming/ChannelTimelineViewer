name: ChannelTimelineViewer

options:
  bundleIdPrefix: com.deskflowlabs
  # 7言語対応（arrows-lite と同じ言語セット）
  developmentLanguage: ja
  knownRegions: [ja, en, zh-Hans, es, de, fr, ko]
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.1"
    # 公開済みは 1.1(29)。同じ番号は再アップロードできないので 30 から。
    # CI（ios-release.yml）は build_number 入力で上書きするため、そちらでも同じ値を渡す。
    CURRENT_PROJECT_VERSION: "30"
    # === 提出準備中 ===
    # Bundle ID は App Store Connect 登録済みの値に設定済み(下のターゲット設定)。
    # DEVELOPMENT_TEAM は Team ID(10桁) を入れると署名が有効になる。空のままなら従来どおり
    # 署名なし(CI は CODE_SIGNING_ALLOWED=NO / ローカルはシミュレーター実行)で動く。
    # Team ID の確認: https://developer.apple.com/account → Membership details
    DEVELOPMENT_TEAM: "893UUWYHB8"

targets:
  ChannelTimelineViewer:
    type: application
    platform: iOS
    sources:
      # Info.plist は INFOPLIST_FILE で使うだけなので、リソースとしてコピーしない
      - path: App
        excludes:
          - Info.plist
      - Models
      - Services
      - ViewModels
      - Views
      - path: Resources
        # Config.plist / Config.example.plist などをバンドルリソースとして含める
      # 表示文言（7言語）
      - path: Localization
    dependencies:
      # 共有シート（Share Extension）。アプリに埋め込まれて一緒に配布される。
      - target: ChannelTimelineViewerShareExtension
        embed: true
      # 共有シート下部のアクション一覧（「Channel Timelineで開く」）。
      - target: ChannelTimelineViewerOpenExtension
        embed: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # 生成される Info.plist に App/Info.plist の内容（カスタムURLスキーム）をマージする。
        INFOPLIST_FILE: App/Info.plist
        # App Store Connect に登録済みの Bundle ID と一致させること
        PRODUCT_BUNDLE_IDENTIFIER: com.deskflowlabs.channeltimelineviewer
        # 署名時に使うプロファイル名。CI から CTV_PROFILE_APP で渡す（未指定なら空＝署名なしビルド）。
        PROVISIONING_PROFILE_SPECIFIER: "$(CTV_PROFILE_APP)"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone のみ
        # アセットカタログ(Resources/Assets.xcassets)のアイコン/アクセントカラーを使用
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "Channel Timeline Viewer"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  # 共有シート（YouTube アプリ / Safari から共有された URL の受け口）。
  # ここでは YouTube API を呼ばず、URL をカスタムURLスキームでメインアプリへ渡すだけ。
  ChannelTimelineViewerShareExtension:
    type: app-extension
    platform: iOS
    sources:
      # 受け渡し処理は2つの拡張で共有する。
      - path: ExtensionShared
      # URL 解析・通知の組み立てはメインアプリと共有する（Foundation / UserNotifications のみ）。
      - path: Services/SharedLinkParser.swift
      - path: Services/AppInfo.swift
      - path: Services/SharedLinkNotifier.swift
      # 表示文言（拡張は自分のバンドルを見るので、こちらにも含める）
      - path: Localization
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.deskflowlabs.channeltimelineviewer.shareextension
        TARGETED_DEVICE_FAMILY: "1"          # iPhone のみ（アプリ本体と一致させる）
        # アプリに埋め込むので単体ではインストールしない
        SKIP_INSTALL: YES
        # 署名時に使うプロファイル名。CI から CTV_PROFILE_EXT で渡す。
        PROVISIONING_PROFILE_SPECIFIER: "$(CTV_PROFILE_EXT)"

  # 共有シート下部の「アクション」一覧に出る拡張（「Channel Timelineで開く」）。
  # アプリ一覧の「その他」を開かなくても届く位置に出すために用意している。
  # 中身は Share Extension と同じ受け渡し処理（ExtensionShared）。
  ChannelTimelineViewerOpenExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ExtensionShared
      - path: Services/SharedLinkParser.swift
      - path: Services/AppInfo.swift
      - path: Services/SharedLinkNotifier.swift
      - path: Localization
      # 共有シートに出るアクション名（CFBundleDisplayName）の翻訳。
      # アプリ本体・共有シート拡張の表示名まで置き換わらないよう、この拡張専用のフォルダにしている。
      - path: Localization-OpenExtension
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OpenExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.deskflowlabs.channeltimelineviewer.openextension
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        PROVISIONING_PROFILE_SPECIFIER: "$(CTV_PROFILE_OPEN)"

  ChannelTimelineViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: ChannelTimelineViewer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.deskflowlabs.channeltimelineviewer.tests

  # App Store 用スクリーンショットを撮るためだけの UI テスト。
  # 実 API とネットワークを使うので、通常の CI(ChannelTimelineViewer スキーム)では実行しない。
  ChannelTimelineViewerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      # 画面の要素を「表示されている文字」で探すため、テスト側にもアプリと同じ翻訳を入れる。
      - path: Localization
    dependencies:
      - target: ChannelTimelineViewer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.deskflowlabs.channeltimelineviewer.uitests
        TEST_TARGET_NAME: ChannelTimelineViewer

schemes:
  ChannelTimelineViewer:
    build:
      targets:
        ChannelTimelineViewer: all
        ChannelTimelineViewerTests: [test]
    test:
      targets:
        - ChannelTimelineViewerTests

  # App 内課金の審査用スクリーンショットを撮るスキーム。
  # StoreKit のテスト設定を読ませて、購入画面に価格が出た状態で撮る。
  ProScreenshot:
    build:
      targets:
        ChannelTimelineViewer: all
        ChannelTimelineViewerUITests: [test]
    # 実行・テストのどちらから起動されても価格が出るように、両方に設定する。
    run:
      storeKitConfiguration: StoreKit/ProStoreKit.storekit
    test:
      targets:
        - ChannelTimelineViewerUITests
      storeKitConfiguration: StoreKit/ProStoreKit.storekit

  # スクリーンショット撮影専用スキーム（通常 CI とは分離）
  Screenshots:
    build:
      targets:
        ChannelTimelineViewer: all
        ChannelTimelineViewerUITests: [test]
    test:
      targets:
        - ChannelTimelineViewerUITests
